[package]
name = "blockworld-client"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
blockworld-utils = { path = "../blockworld-utils" }
blockworld-server = { path = "../blockworld-server" }

enumflags2 = "0.7"
anyhow = "1.0.102"
bytemuck = { version = "1.25.0", features = ["derive"] }
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.10"
glam = "0.33.0"
glyphon = "0.11.0"
image = "0.25.10"
inline_tweak = "1.2.4"
lazy_static = "1.5.0"
log = "0.4.30"
maplit = "1.0.2"
pollster = "0.4.0"
serde = { version = "1.0.228", features = ["derive", "serde_derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = "1.52.3"
wgpu = "29.0.3"
winit = "0.30.13"
slab = "0.4.12"
once_cell = "1.21.4"
bimap = "0.6.3"
egui-wgpu = "0.34.3"
egui_winit_platform = "0.28.0"
egui = "0.34.3"

[[bin]]
name = "blockworld-client"
path = "main.rs"


